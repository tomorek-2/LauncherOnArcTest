plugins {
    id 'java'
    id 'application'

    id 'com.gradleup.shadow' version '9.3.2'
}

version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
sourceSets {
    named("main") {
        java {
            srcDirs = ['core']
        }
        resources {
            srcDirs = ['assets']
        }
    }
}


dependencies {
    implementation "com.github.Anuken.Arc:g3d:v159"
    implementation 'com.github.Anuken.Arc:arc-core:v159'
    implementation 'com.github.Anuken.Arc:backend-sdl:v159'
    implementation 'com.github.Anuken.Arc:natives-desktop:v159'


}

application {
    mainClass = 'singlaunch.SingularityLauncher'
}

run {
    workingDir = projectDir
    jvmArgs "-Dsingularity.launcher.dir=${projectDir}"
}

tasks.named('jar') {
    enabled = true
}

shadowJar {
    archiveFileName = 'SingularityLauncher.jar'
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'singlaunch.SingularityLauncher'
        )

    }
}

tasks.named('build') {
    dependsOn shadowJar
}

